[project]
name = "i-cloud-seven-ai-agent"
version = "0.1.0"
description = "Asistente RAG empresarial con agente de herramientas sobre sistemas legados (FastAPI + LangGraph + Azure)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.162.0",
    "langchain-chroma==1.1.0",
    "langchain-core==1.7.3",
    "langchain-openai==1.7.3",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.19",
    "openai==3.42.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "structlog==26.1.0",
    "tenacity==9.2.1",
    "tiktoken==0.14.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

# =============================================================================
# Calidad estática (ruff sustituye a flake8 + isort + black)
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
extend-exclude = [".venv", "data/vectorstore"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = ["\\.venv/"]

# =============================================================================
# Pruebas
# =============================================================================
# `pythonpath = ["."]` es OBLIGATORIO: uv ejecuta en .venv y `tests/` no es un
# paquete, por lo que sin esta línea `import app` falla.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: pruebas que requieren credenciales reales del proveedor"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
